name: Website

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
      # the browser packer publishes the converters of the same commit (site/packer/sh2conv.zip)
      - "tools/sh2conv/**"
      - "tools/packer-web/bundle.py"
      - "sh2-3ds-port-kit/data/dc/**"
      - "VERSION"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - name: Bundle the converters for the browser packer
        run: python3 tools/packer-web/bundle.py site/packer/sh2conv.zip

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
