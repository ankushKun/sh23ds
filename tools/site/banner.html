<!doctype html>
<!-- The social image and README banner (site/assets/banner.jpg), rendered at 1200 x 630 by
     tools/site/render_banner.sh from the site's own fonts and stylesheet: the home page's title screen. -->
<html lang="en" class="js">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../site/fonts.css">
<link rel="stylesheet" href="../../site/site.css">
<style>
  html, body { width: 1200px; height: 630px; min-height: 0; overflow: hidden; }
  body::before { animation: none; opacity: .14; }
  .banner { width: 1200px; height: 630px; min-height: 0; padding: 0 40px; gap: 30px; }
  .banner .title { font-size: 104px; }
  .banner .title .ch { animation: none; }
  .banner .lede { max-width: 44ch; font-size: 26px; }
  .banner .static { animation: none; opacity: .26; }
  .banner .bloom { top: 40%; animation: none; opacity: 1; }
  .corner { position: absolute !important; bottom: 34px; display: flex; align-items: center; gap: 12px; }
  .corner.left { left: 44px; }
  .corner.right { right: 44px; font: 400 24px/1 var(--mono); letter-spacing: .14em; color: var(--dim); }
</style>
</head>
<body class="home">
<div class="title-screen banner">
  <div class="static"></div>
  <div class="bloom"></div>
  <div class="vig"></div>
  <div class="title-block">
    <h1 class="title">Silent Hill 2</h1>
  </div>
  <p class="lede">A native port of the PC Director’s Cut, with the Enhanced Edition’s fixes built in.</p>
  <div class="corner left">
    <span class="mark"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span>
    <span class="brand-name">sh23ds</span>
  </div>
  <div class="corner right">ANKUSH.ONE/SH23DS</div>
</div>
</body>
</html>
