<!doctype html>
<!-- The social image and README banner (site/assets/banner.jpg), rendered at 1200 x 630 by
     tools/site/render_banner.sh from the site's own fonts, stylesheet, console photo and screenshots. -->
<html lang="en" class="js">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../site/fonts.css">
<link rel="stylesheet" href="../../site/site.css">
<style>
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body::after { display: none; }
  .card {
    position: relative; display: grid; grid-template-columns: 1fr 520px; align-items: center; gap: 40px;
    height: 630px; padding: 0 64px; box-sizing: border-box; overflow: hidden; isolation: isolate;
    background:
      radial-gradient(70% 70% at 74% 48%, rgba(120, 130, 132, 0.3), transparent 60%),
      radial-gradient(60% 50% at 10% 100%, rgba(60, 66, 68, 0.45), transparent 70%),
      var(--bg);
  }
  .card .fog { z-index: -1; }
  .card .mono { margin-bottom: 22px; }
  .card h1 { font: 500 66px/0.98 var(--serif); letter-spacing: -0.018em; }
  .card h1 em { color: var(--fg-2); }
  .card p.lead { margin-top: 22px; font-size: 21px; max-width: 24ch; }
  .card .device { width: 520px; }
</style>
</head>
<body>
<div class="card">
  <div class="fog" aria-hidden="true"><div class="fog-layer a"></div><div class="fog-layer b"></div></div>
  <div>
    <p class="mono">Development build</p>
    <h1>Silent Hill 2<br><em>for the</em> New<br>Nintendo 3DS</h1>
    <p class="lead">A native port of the PC Director’s Cut, running on your own copy of the game.</p>
  </div>
  <div class="device">
    <div class="device-stage">
      <img class="device-photo" src="../../site/assets/new-3ds-angled.png" width="1356" height="1177" alt="">
      <div class="screen screen-top"><img src="../../site/assets/shots/deck-top.jpg" width="400" height="240" alt=""></div>
      <div class="screen screen-bottom"><img src="../../site/assets/shots/deck-bottom.jpg" width="320" height="240" alt=""></div>
    </div>
  </div>
</div>
<script>
  var stage = document.querySelector(".device-stage");
  stage.style.setProperty("--k", (stage.offsetWidth / 1356).toFixed(5));
  stage.classList.add("is-mapped");
</script>
</body>
</html>
