<!doctype html>
<!-- The SILENT HILL 2 wordmark for the banner, in the website's display face (Libre Caslon
     Display, site/fonts). render.sh shoots it at 1024 x 512 on a transparent background and
     scales it to 256 x 128, the top half of atlas.png. The model draws it as a hard-edged cut-out,
     so every pixel is either the letters, their dark edge, or nothing: a solid black outline keeps
     the pale letters readable over the fog. -->
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face {
    font-family: "Display";
    src: url(../../../site/fonts/libre-caslon-display-400-latin.woff2) format("woff2");
  }
  html, body { margin: 0; width: 1024px; height: 512px; background: transparent; }
  .stage { position: relative; width: 1024px; height: 512px; }
  .layer {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-family: "Display", Georgia, serif; line-height: 1;
  }
  .name { font-size: 150px; letter-spacing: 0.06em; margin-right: -0.06em; }
  .two { font-size: 250px; margin-top: -26px; }
  .edge { color: #000; -webkit-text-stroke: 26px #000; }
  .edge .two { -webkit-text-stroke: 30px #000; }
  .face .name { color: #e4e0d6; }
  .face .two { color: #b3121b; }
</style>
</head>
<body>
  <div class="stage">
    <div class="layer edge"><div class="name">SILENT HILL</div><div class="two">2</div></div>
    <div class="layer face"><div class="name">SILENT HILL</div><div class="two">2</div></div>
  </div>
</body>
</html>
